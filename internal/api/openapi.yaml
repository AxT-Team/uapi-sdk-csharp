  /answerbook/ask:
    get:
      description: |-
        想要获得人生问题的神秘答案吗？答案之书API提供了一个神奇8球风格的问答服务，你可以提问并获得随机的神秘答案。

        ## 功能概述
        通过向答案之书提问，你将获得一个充满智慧（或许）的随机答案。这个API支持通过查询参数或POST请求体两种方式提问。
      externalDocs:
        description: Interactive API reference
        url: https://uapis.cn/docs/api-reference/get-answerbook-ask
      operationId: get-answerbook-ask
      parameters:
      - description: 你想要提问的问题。问题不能为空。
        example: 我今天会有好运吗？
        explode: true
        in: query
        name: question
        required: true
        schema:
          example: 我今天会有好运吗？
          type: string
        style: form
        x-tooltip: 必填，如："我今天会有好运吗？"、"我应该接受这份工作吗？"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_answerbook_ask_200_response"
          description: 成功获取答案。
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_answerbook_ask_400_response"
          description: 请求参数无效。
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_answerbook_ask_500_response"
          description: 服务器内部错误。
      summary: 答案之书
      tags:
      - Random
      x-search-words:
      - 答案之书
      - 神奇8球
      - 占卜
      - 预测
      - 问答
      - 神秘答案
      - fortune
      - magic 8 ball
      - oracle
      - divination
      x-docs-url: https://uapis.cn/docs/api-reference/get-answerbook-ask
