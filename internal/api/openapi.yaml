          description: 服务器处理失败，例如图片编码阶段发生错误。
        "502":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/post_image_decode_502_response"
          description: 图片下载失败，或者图片链接返回的不是可识别的图片内容。
        "503":
