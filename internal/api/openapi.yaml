  /watermark/producer-code:
    post:
      description: |-
        还在发愁怎么拼出符合《GB 45438-2025》要求的 27 位 AIGC 服务提供者编码？无论是想一键生成自己的专属合规编码，还是想校验已有编码对不对，这个接口都能帮您轻松搞定。

        ## 功能概述
        此接口具备“生成”与“校验”双重能力：
        - **生成模式**：填入组织或个人的主体身份信息与证件号，接口会自动处理复杂的拼位规则，输出标准的 27 位编码。
        - **校验模式**：仅需填入现成的 `code`，接口将逐段拆解、验证其合法性，并解析出各个组成部分的实际含义。

        ## 使用须知
        **模式互斥**：当您在请求体中填入了 `code` 参数时，接口会自动进入“校验模式”，其余的生成参数将被忽略；反之则进入“生成模式”。

        **独立生成**：该编码不依赖向外部机构注册申请，而是基于您的法定身份标识（如企业统一社会信用代码、个人身份证等）根据标准算法独立生成即可。
      externalDocs:
        description: Interactive API reference
        url: https://uapis.cn/docs/api-reference/post-watermark-producer-code
      operationId: post-watermark-producer-code
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/post_watermark_producer_code_request"
        description: 生成所需的身份信息，或用于校验的 27 位现成编码。支持 application/json。
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/post_watermark_producer_code_200_response"
          description: 操作成功，返回生成的编码或校验的解析报告。
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/post_watermark_producer_code_400_response"
          description: 参数无效，主体信息不完整或编码校验失败。
      security:
      - BearerAuth: []
      summary: 生成 AIGC 服务提供者编码
      tags:
      - 水印与 AIGC 标识
      x-search-words:
      - 服务提供者编码
      - ContentProducer
      - 27位编码
      - AIGC编码
      - 编码校验
      - 编码生成
      - 主体编码
      x-faq:
      - answer: 不需要。国标规定的服务提供者编码是采用特定拼接算法生成的本地标识串。本接口仅提供标准化的生成与校验算法服务。
        question: 我需要向任何官方平台申请获取这个编码吗？
      - answer: 为了保障合规，两者使用的基础凭据不同。企业组织强制要求使用统一社会信用代码；而自然人可根据实际情况选择身份证、手机号等方式。接口会在底层自动处理不同证件格式对应的补位填充逻辑。
        question: 组织和个人的编码在生成算法上有什么不同？
