  /misc/holiday-calendar:
    get:
      description: |-
        查询指定日期、月份或年份的万年历与节假日信息。

        ## 功能概述
        这个接口支持三种查询方式：按天（`date`）、按月（`month`）和按年（`year`）。调用时三者选一个传入即可。

        如果你只关心某一类事件，可以通过 `holiday_type` 进行筛选，例如只看法定休假/调休、公历节日、农历节日或节气。

        在 `date` 模式下，传 `include_nearby=true` 可以额外返回该日期前后最近的节日；返回数量由 `nearby_limit` 控制，默认 7，最大 30。

        如果你只想保留今天和之后的节日，可以再传 `exclude_past=true` 过滤已经过去的节日。
      externalDocs:
        description: Interactive API reference
        url: https://uapis.cn/docs/api-reference/get-misc-holiday-calendar
      operationId: get-misc-holiday-calendar
      parameters:
      - description: 按天查询时填写这个参数，例如查某一天。格式：`YYYY-MM-DD`。和 `month`、`year` 三选一。
        explode: true
        in: query
        name: date
        required: false
        schema:
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          type: string
        style: form
        x-tooltip: 三选一：按天查询时填写 YYYY-MM-DD。
      - description: 按月查询时填写这个参数，例如查某个月。格式：`YYYY-MM`。和 `date`、`year` 三选一。
        explode: true
        in: query
        name: month
        required: false
        schema:
          pattern: "^\\d{4}-\\d{2}$"
          type: string
        style: form
        x-tooltip: 三选一：按月查询时填写 YYYY-MM。
      - description: 按年查询时填写这个参数，例如查某一年。格式：`YYYY`。和 `date`、`month` 三选一。
        explode: true
        in: query
        name: year
        required: false
        schema:
          pattern: "^\\d{4}$"
          type: string
        style: form
        x-tooltip: 三选一：按年查询时填写 YYYY。
      - description: 时区名称，默认 Asia/Shanghai。
        example: Asia/Shanghai
        explode: true
        in: query
        name: timezone
        required: false
        schema:
          default: Asia/Shanghai
          example: Asia/Shanghai
          type: string
        style: form
        x-tooltip: 推荐传 IANA 时区名。
      - description: 节日筛选类型，默认 all。
        example: legal
        explode: true
        in: query
        name: holiday_type
        required: false
        schema:
          default: all
          enum:
          - all
          - legal
          - legal_rest
          - legal_workday
          - solar
          - lunar
          - term
          example: legal
          type: string
        style: form
        x-tooltip: 不传就是 all；新手可先不传。
      - description: 是否返回前后最近节日，仅 date 模式生效，默认 false。month/year 模式会忽略此参数。
        example: true
        explode: true
        in: query
        name: include_nearby
        required: false
        schema:
          default: false
          example: true
          type: boolean
        style: form
        x-tooltip: 想看前后节日时设为 true（仅 date 模式）。
      - description: 返回最近节日数量限制，默认 7，最大 30。仅 date 模式 + include_nearby=true 生效。
        example: 7
        explode: true
        in: query
        name: nearby_limit
        required: false
        schema:
          default: 7
          example: 7
          maximum: 30.0
          type: integer
        style: form
        x-tooltip: 只在 date 模式有用。
      - description: 传 true 时，会过滤今天之前已经过去的节日。默认 false。
        example: true
        explode: true
        in: query
        name: exclude_past
        required: false
        schema:
          default: false
          example: true
          type: boolean
        style: form
        x-tooltip: 想只看今天和之后的节日时传 true。
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_misc_holiday_calendar_200_response"
          description: 查询成功，返回指定范围的万年历与节假日信息。
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_misc_holiday_calendar_400_response"
          description: |-
            请求参数错误。常见原因：
            - `date`、`month`、`year` 未传或同时传入多个
            - 日期格式错误：`date` 必须为 `YYYY-MM-DD`、`month` 必须为 `YYYY-MM`、`year` 必须为 `YYYY`
            - `holiday_type` 非法
            - `timezone` 非法
      summary: 查询节假日与万年历
      tags:
      - Misc
      x-search-words:
      - 节假日
      - 万年历
      - 法定假日
      - 调休
      - 节气
      - holiday
      - calendar
      - lunar
      - solar festival
      - workday
      x-docs-url: https://uapis.cn/docs/api-reference/get-misc-holiday-calendar
  /misc/hotboard:
    get:
      description: |-
        想快速跟上网络热点？这个接口让你一网打尽各大主流平台的实时热榜/热搜！

        ## 功能概述
        你只需要指定一个平台类型，就能获取到该平台当前的热榜数据列表。每个热榜条目都包含标题、热度值和原始链接。非常适合用于制作信息聚合类应用或看板。

        ## 三种使用模式

        ### 默认模式
        只传 `type` 参数，返回该平台当前的实时热榜。

        ### 时光机模式
        传 `type` + `time` 参数，返回指定时间附近最近可展示的历史热榜快照。

        ### 搜索模式
        传 `type` + `keyword` + `time_start` + `time_end` 参数，在指定历史时间范围内搜索包含关键词的热榜条目。可选传 `limit` 限制返回数量。
