              schema:
                $ref: "#/components/schemas/get_network_dns_400_response"
          description: 请求参数无效。请检查 `domain` 参数是否提供且格式正确。
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_network_whois_404_response"
