  /misc/lunartime:
    get:
      description: |-
        需要在指定时区下查看某个时间点的农历信息？这个接口可以直接返回完整结果。

        ## 功能概述
        支持传入 Unix 时间戳（秒或毫秒）和 IANA 时区名，返回公历时间、星期、农历年月日、干支、生肖、节气与节日信息。不传 `ts` 时默认使用当前时间，不传 `timezone` 时默认 `Asia/Shanghai`。

        ## 时区说明
        - 支持标准 IANA 时区，例如 `Asia/Shanghai`、`Asia/Tokyo`
        - 也支持别名：`Shanghai`、`Beijing`
        - 时区非法时返回 400 并提示 `invalid timezone: xxx`
      externalDocs:
        description: Interactive API reference
        url: https://uapis.cn/docs/api-reference/get-misc-lunartime
      operationId: get-misc-lunartime
      parameters:
      - description: Unix 时间戳，支持 10 位秒级或 13 位毫秒级。不传则默认当前时间。
        example: "1707537600"
        explode: true
        in: query
        name: ts
        required: false
        schema:
          example: "1707537600"
          type: string
        style: form
        x-tooltip: 支持秒和毫秒时间戳。
      - description: 时区名称。支持 IANA 时区（如 Asia/Shanghai）和别名（Shanghai、Beijing）。默认 Asia/Shanghai。
        example: Asia/Shanghai
        explode: true
        in: query
        name: timezone
        required: false
        schema:
          example: Asia/Shanghai
          type: string
        style: form
        x-tooltip: 推荐使用 IANA 时区名。
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_misc_lunartime_200_response"
          description: 查询成功，返回指定时间和时区下的农历信息。
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_misc_lunartime_400_response"
          description: "请求参数错误。`timezone` 非法时返回 `invalid timezone: xxx`，`ts` 非法时返回\
            \ `invalid timestamp: xxx`。"
      summary: 查询农历时间
      tags:
