        - **自动识别**：不知道是哪家快递？系统会根据单号规则自动识别快递公司（推荐使用）
        - **手动指定**：如果已知快递公司，可以传递 `carrier_code` 参数，查询速度会更快
        - **手机尾号验证**：顺丰等部分快递公司需要验证收件人手机尾号才能查询详细物流，如果返回 `暂无物流信息`，建议尝试传入 `phone` 参数
        - **查询时效**：物流信息实时查询，响应时间通常在1-2秒内
      externalDocs:
        description: Interactive API reference
        url: https://uapis.cn/docs/api-reference/get-misc-tracking-query
      operationId: get-misc-tracking-query
      parameters:
      - description: 快递单号，通常是一串10-20位的数字或字母数字组合。
        example: YT1234567890123
        explode: true
        in: query
        name: tracking_number
        required: true
        schema:
          example: YT1234567890123
          type: string
        style: form
