      - description: 快递公司编码（可选）。不填写时系统会自动识别，填写后可加快查询速度。
        explode: true
        in: query
        name: carrier_code
        required: false
        schema:
          type: string
        style: form
        x-tooltip: 例如：zhongtong、yuantong、yunda 等
      - description: 收件人手机尾号，4位数字（可选）。部分快递公司需要验证手机尾号才能查询详细物流信息。
        explode: true
        in: query
        name: phone
        required: false
        schema:
          pattern: "^\\d{4}$"
