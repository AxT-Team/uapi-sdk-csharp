        description: Interactive API reference
        url: https://uapis.cn/docs/api-reference/get-image-bing-daily
      operationId: get-image-bing-daily
      parameters:
      - description: 壁纸日期，格式是 `YYYY-MM-DD`。不传时返回当天壁纸。
        explode: true
        in: query
        name: date
        required: false
        schema:
          type: string
        style: form
      - description: 是否每次请求随机返回一张历史壁纸。传 `true` 时生效；不能和 `date` 同时使用。不传或传 `false` 时保持默认当天/指定日期逻辑。
        example: true
        explode: true
        in: query
        name: random
        required: false
        schema:
          default: false
          example: true
          type: boolean
        style: form
      - description: 返回图片的目标分辨率。可以传 `4k` 或 `1080`，不传时默认是 `4k`。
        example: 4k
        explode: true
        in: query
        name: resolution
        required: false
        schema:
          default: 4k
          enum:
          - 4k
          - "1080"
          example: 4k
          type: string
        style: form
      - description: 响应格式。可以传 `image`、`json` 或 `redirect`。不传时默认是 `image`。
        explode: true
        in: query
        name: format
        required: false
        schema:
          default: image
          enum:
          - image
          - json
          - redirect
          type: string
        style: form
      responses:
