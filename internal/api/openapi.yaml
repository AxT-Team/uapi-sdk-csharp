  /sensitive-word/analyze:
    post:
      description: "分析单个或多个关键词的敏感程度，返回标准化风险标签与置信度结果。\n\n## 功能概述\n\n- **风险分析**: 结合文\
        本内容给出语义层面的风险判断。\n- **响应稳定**: 兼顾高频调用场景下的处理效率和响应速度。\n- **并发支持**: 支持批量并发处理，单次\
        最多可分析100个关键词。\n- **输入限制**: 单条关键词最多 1,000 字符，总字符数最多 20,000。\n- **标准标签**: 返回\
        \ `label` 字段，明确区分 `sensitive` 与 `normal`。\n- **分类清晰**: 返回 `category` 字段，用于\
        标识具体风险类别。\n- **置信度输出**: 返回 `confidence` 字段，范围为0.0到1.0。\n\n## 响应字段说明\n\n| 字\
        段 | 类型 | 说明 |\n|------|------|------|\n| `results` | array | 分析结果对象的数组。 |\n\
        | `results[].k` | string | 您在请求中提供的原始关键词。 |\n| `results[].label` | string\
        \ | 核心判断字段：`sensitive`(敏感)、`normal`(正常)。 |\n| `results[].category` | string\
        \ | 风险分类：`safe`(安全)、`threat`(威胁)、`porn`(色情)、`fraud`(欺诈)、`insult`(辱骂)。 |\n\
        | `results[].confidence` | number | 当前分类的置信度，范围0.0到1.0。 |\n| `total` | integer\
        \ | 本次请求成功分析的关键词总数。 |\n      "
