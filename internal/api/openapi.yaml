    get:
      description: |-
        想给你的学习打卡、英语小组件或机器人推送加一个『每日单词』？这个接口每天给你一个稳定的单词，同一天多次请求结果一致。

        ## 功能概述
        默认返回 1 个英文单词，支持按词库范围筛选，可选择是否附带例句和音标。也可以用 `count` 一次返回多个词，用于词汇复习列表。

        ## 词库选项
        - `all`：全部英文词库，适合通用每日推荐。
        - `cet4`：大学英语四级词汇，适合基础复习。
        - `cet6`：大学英语六级词汇，适合进阶复习。
        - `ielts`：雅思词汇，适合留学考试准备。
        - `toefl`：托福词汇，适合北美考试准备。
        - `gre`：GRE 词汇，适合高阶词汇训练。

        ## 使用须知
        > [!IMPORTANT]
        > `date` 与 `seed` 用于复现某一天或某个固定的取词结果，二者不能同时传入。
