  /misc/weather/history:
    get:
      description: |-
        想知道某个城市过去一段时间有没有下雨、降雨量是多少？这个接口用于查询过去最多 366 天的城市每日历史天气。

        ## 功能概述
        支持按 `city`、`adcode` 或客户端 IP 自动定位查询。你可以传 `start_date` + `end_date` 指定日期范围，也可以只传 `days` 回看最近若干天。返回结果重点包含 `rained` 与 `rain`，适合做出行复盘、农业记录、气象看板和数据分析。

        ## 使用须知
        > [!NOTE]
        > 定位优先级：`adcode` > `city` > IP 自动定位。同时传 `start_date` 和 `days` 时，以 `start_date` + `end_date` 区间为准。
      externalDocs:
        description: Interactive API reference
        url: https://uapis.cn/docs/api-reference/get-misc-weather-history
      operationId: get-misc-weather-history
      parameters:
      - description: 城市名称，支持中文或英文；可选，不传 city/adcode 时会尝试 IP 自动定位。
        example: 北京
        explode: true
        in: query
        name: city
        required: false
        schema:
          example: 北京
          type: string
        style: form
      - description: 6 位行政区划代码，优先级高于 city。
        example: "110000"
        explode: true
        in: query
        name: adcode
        required: false
        schema:
          example: "110000"
          type: string
        style: form
      - description: 起始日期，格式 YYYY-MM-DD；与 end_date 搭配使用。
        example: 2026-05-01
        explode: true
        in: query
        name: start_date
        required: false
        schema:
          example: 2026-05-01
          type: string
        style: form
      - description: 结束日期，格式 YYYY-MM-DD，默认昨天。
        example: 2026-05-31
        explode: true
        in: query
        name: end_date
        required: false
        schema:
          example: 2026-05-31
          type: string
        style: form
      - description: 回看天数，1-366，默认 365；仅在未指定 start_date 时生效。
        example: 30
        explode: true
        in: query
        name: days
        required: false
        schema:
          default: 365
          example: 30
          type: integer
        style: form
      - description: 返回语言：zh（默认）或 en。
        explode: true
        in: query
        name: lang
        required: false
        schema:
          default: zh
          enum:
          - zh
          - en
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_misc_weather_history_200_response"
          description: 查询成功，返回城市历史每日天气。
        "400":
          description: 参数错误，例如日期格式不正确或 lang 不是 zh/en。
        "404":
          description: 未找到城市位置。
        "502":
          description: 服务暂时不可用，请稍后重试。
