      - mx
      - txt
      x-seo-optimized-text: 免费DNS解析查询API接口，在线DNS查询工具，支持A、AAAA、CNAME、MX、NS、TXT等记录类型查询。快速准确的域名解析服务，适用于网络诊断、域名管理、网络安全等场景。
      x-seo-keywords:
      - 免费DNS查询API
      - 域名解析接口
