        - 当传 `format=json` 时，返回的是扁平 JSON 对象，里面会包含标题、副标题、说明文案、版权信息、问答信息和图片地址等字段

        ## 参数说明
        `resolution` 默认是 `4k`。
        `format` 默认是 `image`。
