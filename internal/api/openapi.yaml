      x-docs-url: https://uapis.cn/docs/api-reference/post-clipzy-store
  /avatar/gravatar:
    get:
      description: 提供稳定、易用的头像获取能力，适合在网页或应用中直接展示头像。
      externalDocs:
        description: Interactive API reference
        url: https://uapis.cn/docs/api-reference/get-avatar-gravatar
      operationId: get-avatar-gravatar
      parameters:
      - description: 用户的 Email 地址。如果未提供 `hash` 参数，则此参数为必需。
        example: shuakami@sdjz.wiki
        explode: true
        in: query
        name: email
        required: false
        schema:
          example: shuakami@sdjz.wiki
          type: string
        style: form
      - description: 用户 Email 地址的小写 MD5 哈希值。如果提供此参数，将忽略 `email` 参数。
        explode: true
        in: query
        name: hash
        required: false
        schema:
          type: string
        style: form
      - description: 头像的尺寸，单位为像素。有效范围是 1 到 2048。
        explode: true
        in: query
        name: s
        required: false
        schema:
          default: 80
          type: integer
        style: form
      - description: "当用户没有自己的 Gravatar 头像时，显示的默认头像类型。可选值包括 `mp`, `identicon`, `monsterid`,\
          \ `wavatar`, `retro`, `robohash`, `blank`, `404`。"
        explode: true
        in: query
        name: d
        required: false
        schema:
          default: mp
          type: string
        style: form
      - description: "头像分级。可选值：`g`, `pg`, `r`, `x`。"
        explode: true
        in: query
        name: r
        required: false
        schema:
          default: g
          type: string
        style: form
      responses:
        "200":
          content:
            image/png:
              schema:
                format: binary
                type: string
          description: 成功响应，返回图片二进制数据。
          headers:
            Content-Type:
              explode: false
              schema:
                example: image/png
                type: string
              style: simple
            ETag:
              explode: false
              schema:
                type: string
              style: simple
            Cache-Control:
              explode: false
              schema:
                example: "public, max-age=3600"
                type: string
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_avatar_gravatar_400_response"
          description: 当请求中既没有提供 `email` 也没有提供 `hash` 参数时。
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_avatar_gravatar_404_response"
          description: 当 `d=404` 且请求的 email 或 hash 没有对应的 Gravatar 头像时。
      summary: 获取Gravatar头像
      tags:
      - Image
      x-search-words:
      - gravatar
      - avatar
      - 头像
      - email
      - md5
      - 头像代理
      x-docs-url: https://uapis.cn/docs/api-reference/get-avatar-gravatar
  /convert/json:
    post:
      description: |-
        还在为一团乱麻的 JSON 字符串头疼吗？这个接口能瞬间让它变得井井有条，赏心悦目。

        ## 功能概述
        你只需要提供一个原始的、可能是压缩过的或者格式混乱的 JSON 字符串，这个 API 就会返回一个经过美化（带标准缩进和换行）的版本。这在调试 API 响应、或者需要在前端界面清晰展示 JSON 数据时非常有用。

        ## 使用须知
        > [!NOTE]
        > **请求格式**
        > 请注意，待格式化的 JSON 字符串需要被包裹在另一个 JSON 对象中，作为 `content` 字段的值提交。具体格式请参考请求体示例。

        ## 错误处理指南
        - **400 Bad Request**: 最常见的原因是你提供的 `content` 字符串本身不是一个有效的 JSON。请仔细检查括号、引号是否正确闭合，或者有没有多余的逗号等语法错误。
      externalDocs:
        description: Interactive API reference
        url: https://uapis.cn/docs/api-reference/post-convert-json
      operationId: post-convert-json
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/post_convert_json_request"
        description: 这是一个JSON对象，里面必须包含一个名为 `content` 的字段。这个字段的值，就是你希望格式化的、原始的JSON字符串。
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/post_convert_json_200_response"
          description: 格式化成功！返回一个包含美化后JSON字符串的对象。
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/post_convert_json_400_response"
          description: 请求失败。这通常意味着你提供的 `content` 字符串不是一个合法的JSON格式。请检查括号、引号是否匹配，以及末尾是否有多余的逗号等常见错误。
      summary: JSON 格式化
      tags:
      - Convert
      x-search-words:
      - 格式化
      - 美化
      - 校验
      - 验证
      - 压缩
      - 字符串
      - prettify
      - beautify
      - format
      - validate
      - parse
      x-seo-optimized-text: 免费JSON格式化API接口，快速美化和格式化JSON字符串。支持JSON校验、压缩、美化等功能。专业的JSON处理工具，适用于API调试、数据展示、开发调试等场景。
      x-seo-keywords:
      - 免费JSON格式化API
      - JSON美化接口
      - JSON校验API
      - JSON解析服务
      - JSON处理工具
