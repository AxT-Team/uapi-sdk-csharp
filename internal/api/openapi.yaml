  /misc/randomnumber:
    get:
      description: |-
        需要一个简单的随机数，还是需要一串不重复的、带小数的随机数？这个接口都能满足你！

        ## 功能概述
        这是一个强大的随机数生成器。你可以指定生成的范围（最大/最小值）、数量、是否允许重复、以及是否生成小数（并指定小数位数）。

        ## 使用须知
        > [!WARNING]
        > **不重复生成的逻辑限制**
        > 当设置 `allow_repeat=false` 时，请确保取值范围 `(max - min + 1)` 大于或等于你请求的数量 `count`。否则，系统将无法生成足够的不重复数字，请求会失败并返回 400 错误。
      externalDocs:
        description: Interactive API reference
        url: https://uapis.cn/docs/api-reference/get-misc-randomnumber
      operationId: get-misc-randomnumber
      parameters:
      - description: 生成随机数的最小值（包含）。
        example: 10
        explode: true
        in: query
        name: min
        required: false
        schema:
          default: 1
          example: 10
          type: integer
        style: form
        x-tooltip: 默认为 1。
      - description: 生成随机数的最大值（包含）。
        example: 50
        explode: true
        in: query
        name: max
        required: false
        schema:
          default: 100
          example: 50
          type: integer
        style: form
        x-tooltip: 默认为 100。
      - description: 需要生成的随机数的数量。
        example: 5
        explode: true
        in: query
        name: count
        required: false
        schema:
          default: 1
          example: 5
          type: integer
        style: form
        x-tooltip: 默认为 1。
      - description: 是否允许生成的多个数字中出现重复值。
        example: true
        explode: true
        in: query
        name: allow_repeat
        required: false
        schema:
          default: false
          example: true
          type: boolean
        style: form
        x-tooltip: 默认为 false (不重复)。
      - description: 是否生成小（浮点）数。如果为 false，则只生成整数。
        example: true
        explode: true
        in: query
        name: allow_decimal
        required: false
        schema:
          default: false
          example: true
          type: boolean
        style: form
        x-tooltip: 默认为 false (整数)。
      - description: 如果 `allow_decimal=true`，这里可以指定小数的位数。
        example: 2
        explode: true
        in: query
        name: decimal_places
        required: false
        schema:
          default: 2
          example: 2
          type: integer
        style: form
        x-tooltip: 仅在 allow_decimal=true 时生效。
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_misc_randomnumber_200_response"
          description: 生成成功！返回一个包含随机数的数组。
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_misc_randomnumber_400_response"
          description: 请求参数无效。例如，`min` 大于 `max`，或者在不允许重复的情况下，请求的数量大于可能生成的数字总数。
      summary: 随机数生成
      tags:
      - Misc
      x-search-words:
      - 随机数
      - 生成
      - 整数
      - 小数
      - random
      - number
      - generator
      - int
      - float
      - 抽奖
      - 摇号
      x-docs-url: https://uapis.cn/docs/api-reference/get-misc-randomnumber
