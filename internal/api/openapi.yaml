  /network/icp:
    get:
      description: |-
        想知道一个网站的背后运营主体是谁吗？如果它是在中国大陆运营的，ICP备案信息可以告诉你答案。

        ## 功能概述
        提供一个域名，查询其在中国工信部的ICP（Internet Content Provider）备案信息。这对于商业合作前的背景调查、验证网站合法性等场景很有帮助。

        > [!NOTE]
        > **查询范围**
        > 此查询仅对在中国大陆工信部进行过备案的域名有效。对于国外域名或未备案的域名，将查询不到结果。
      externalDocs:
        description: Interactive API reference
        url: https://uapis.cn/docs/api-reference/get-network-icp
      operationId: get-network-icp
      parameters:
      - description: 需要查询的域名或URL
        example: baidu.com
        explode: true
        in: query
        name: domain
        required: true
        schema:
          example: baidu.com
          type: string
        style: form
        x-tooltip: 可输入域名或包含域名的URL
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_network_icp_200_response"
          description: 查询成功！返回该域名的ICP备案详情。
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_network_dns_400_response"
          description: 请求参数无效。请检查 `domain` 参数是否提供且格式正确。
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_network_icp_404_response"
          description: 未查询到备案信息。该域名可能没有在工信部备案，或者当前暂无可用结果。
      summary: 查询域名ICP备案信息
