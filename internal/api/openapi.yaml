        description: Interactive API reference
        url: https://uapis.cn/docs/api-reference/get-image-bing-daily-history
      operationId: get-image-bing-daily-history
      parameters:
      - description: 壁纸日期，格式是 `YYYY-MM-DD`。传了以后会按日期精确查询，并且忽略 `page` 和 `page_size`。
