        explode: true
        in: query
        name: activity_scope
        required: false
        schema:
          default: all
          enum:
          - all
          - organization
          type: string
        style: form
      - description: 组织登录名。如果传入此参数，会自动视为开启 organization 级别的贡献查询，切勿再同时传 activity_scope=all。
        explode: true
        in: query
        name: org
        required: false
        schema:
          type: string
        style: form
      - description: 是否附带该用户在 GitHub 主页展示的 pinned 仓库数据。传入 true 开启，其他值均视为不开启。
        explode: true
        in: query
        name: pinned
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: 是否附带该用户最近活跃的公开仓库列表。传入 true 开启，其他值均视为不开启。
        explode: true
        in: query
        name: repos
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: 公开仓库列表的返回数量。只有开启 repos 时才有意义；如果单独传入 repos_limit，也会自动视为开启 repos。
        explode: true
        in: query
        name: repos_limit
        required: false
        schema:
          default: 6
          maximum: 100.0
          minimum: 1.0
          type: integer
        style: form
