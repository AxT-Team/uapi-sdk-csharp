  /social/bilibili/replies:
    get:
      description: |-
        想要分析B站视频的评论区？这个接口可以帮你轻松获取评论数据，包括热门评论和最新评论，还支持分页加载。

        ## 功能概述
        通过视频的 `oid`（通常就是视频的`aid`），你可以分页获取该视频的评论区内容。你可以指定排序方式和分页参数，来精确地获取你需要的数据。

        ## 参数说明
        - **`sort` (排序方式)**
          - `0` 或 `time`：按时间排序
          - `1` 或 `like`：按点赞排序
          - `2` 或 `reply`：按回复数排序
          - `3` 或 `hot`（也支持 `hottest`、`最热`）：按最热排序

        ## 响应体字段说明
        - **`hots` (热门评论)**: 仅在请求第一页时，可能会返回热门评论列表。其结构与 `replies` 中的对象一致。
        - **`replies` (评论列表)**: 这是一个数组，包含了当前页的评论。其中：
          - `root`: 指向根评论的ID。如果评论本身就是根评论，则为 `0`。
          - `parent`: 指向该条回复所回复的上一级评论ID。如果评论是根评论，则为 `0`。
      externalDocs:
        description: Interactive API reference
        url: https://uapis.cn/docs/api-reference/get-social-bilibili-replies
      operationId: get-social-bilibili-replies
      parameters:
      - description: 目标评论区的ID。对于视频，这通常就是它的 `aid`。
        example: "1706416465"
        explode: true
        in: query
        name: oid
        required: true
        schema:
          example: "1706416465"
          type: string
        style: form
      - description: 排序方式。支持 `0/time`（按时间）、`1/like`（按点赞）、`2/reply`（按回复数）、`3/hot/hottest/最热`（按最热）。默认为
          `0/time`。
        example: hot
        explode: true
        in: query
        name: sort
        required: false
        schema:
          enum:
          - time
          - like
          - reply
          - hot
          example: hot
          type: string
        style: form
        x-tooltip: 推荐使用 hot 查看最热评论。
      - description: 每页获取的评论数量，范围是1到20。默认为 `20`。
        example: "5"
        explode: true
        in: query
        name: ps
        required: false
        schema:
          example: "5"
          type: string
        style: form
      - description: 要获取的页码，从1开始。默认为 `1`。
        example: "1"
        explode: true
        in: query
        name: pn
        required: false
        schema:
          example: "1"
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_social_bilibili_replies_200_response"
          description: 成功！返回指定分页和排序的评论列表。
