  /network/dns:
    get:
      description: |-
        想知道一个域名指向了哪个IP？或者它的邮件服务器是谁？这个接口就像一个在线的 `dig` 或 `nslookup` 工具。

        ## 功能概述
        你可以查询指定域名的各种DNS记录，包括 `A` (IPv4), `AAAA` (IPv6), `CNAME` (别名), `MX` (邮件交换), `NS` (域名服务器) 和 `TXT` (文本记录)。
      externalDocs:
        description: Interactive API reference
        url: https://uapis.cn/docs/api-reference/get-network-dns
      operationId: get-network-dns
      parameters:
      - description: 你需要查询的域名，例如 'cn.bing.com'。
        example: cn.bing.com
        explode: true
        in: query
        name: domain
        required: true
        schema:
          example: cn.bing.com
          type: string
        style: form
        x-tooltip: "例如: cn.bing.com"
      - description: 你想要查询的DNS记录类型。
        example: A
        explode: true
        in: query
        name: type
        required: false
        schema:
          default: A
          enum:
          - A
          - AAAA
          - CNAME
          - MX
          - NS
          - TXT
          example: A
          type: string
        style: form
        x-tooltip: 默认为 'A' 记录。
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_network_dns_200_response"
          description: 查询成功！返回解析到的DNS记录列表。
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_network_dns_400_response"
          description: 请求参数无效。请检查 `domain` 参数是否提供且格式正确。
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_network_dns_404_response"
          description: 未找到DNS记录。该域名可能不存在，或者不存在你所查询类型的记录（例如，一个没有配置MX记录的域名）。
      summary: 执行DNS解析查询
      tags:
      - Network
      x-search-words:
