  /network/ping:
    get:
      description: |-
        想知道从我们的服务器到你的服务器网络延迟高不高？这个工具可以帮你测试网络连通性。

        ## 功能概述
        这个接口会从我们的服务器节点对你指定的主机（域名或IP地址）执行 ICMP Ping 操作。它会返回最小、最大、平均延迟以及丢包率等关键指标，是诊断网络问题的得力助手。
      externalDocs:
        description: Interactive API reference
        url: https://uapis.cn/docs/api-reference/get-network-ping
      operationId: get-network-ping
      parameters:
      - description: 你需要 Ping 的目标主机，可以是域名或IP地址。
        example: cn.bing.com
        explode: true
        in: query
        name: host
        required: true
        schema:
          example: cn.bing.com
          type: string
        style: form
        x-tooltip: "例如: cn.bing.com 或 8.8.8.8"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_network_ping_200_response"
          description: Ping 操作成功！返回延迟统计数据。
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_network_ping_400_response"
          description: |-
            请求失败，参数无效或目标不可达。前端可直接展示 `message` 字段。

            **可能原因**:
            - **无法解析主机**: `host` 参数是一个无效的域名或IP地址。
              ```json
              {
                  "code": "INVALID_PARAMETER",
                  "message": "无法解析主机 '无效的主机名'，请检查输入是否正确。"
              }
              ```
            - **Ping 超时**: 目标主机无法访问或被防火墙拦截。
              ```json
              {
                  "code": "INVALID_PARAMETER",
                  "message": "对主机 '目标主机' 的 Ping 请求超时，目标可能不可达或防火墙已拦截。"
              }
              ```
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_network_ping_429_response"
          description: |-
            服务繁忙。当服务器 Ping 请求过多时，会触发限流。前端可直接展示 `message` 字段。

            ```json
            {
                "code": "SERVICE_BUSY",
                "message": "Ping 服务正忙，请稍后再试。"
            }
            ```
      summary: Ping 主机
