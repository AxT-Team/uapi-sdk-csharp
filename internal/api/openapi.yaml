  /dictionary/lookup:
    get:
      description: |-
        想在自己的背单词应用、阅读插件或聊天机器人里加个查词功能？输入一个英文单词，就能立刻拿到一本详尽的“微型词典”。

        ## 功能概述
        传入你要查询的英文单词，接口会返回一整份全方位的词条数据。数据结构是高度动态的——如果某个单词没有常见词组或近义词，对应的字段会自动省略，方便前端精简渲染。

        ## 返回内容涵盖
        - **音标与发音** (`phonetics`)：包含英式（UK）与美式（US）音标，以及可直接在前端播放的发音音频链接。
        - **中文释义** (`definitions`)：按词性归类的中文翻译。
        - **英英释义** (`english_definitions`)：英文原汁原味的解释及附带的短例句。
        - **词形变化** (`word_forms`)：复数、过去式、比较级等形态转换。
        - **词组与近义词** (`phrases` / `synonyms`)：常见的搭配词组，以及按词性归类的近义词。
        - **双语例句** (`examples`)：真实语境下的中英双语例句。
      externalDocs:
        description: Interactive API reference
        url: https://uapis.cn/docs/api-reference/get-dictionary-lookup
      operationId: get-dictionary-lookup
      parameters:
      - description: 要查询的英文单词，长度不超过 64 个字符。
        example: present
        explode: true
        in: query
        name: word
        required: true
        schema:
          example: present
          type: string
        style: form
      - description: 目标语种。目前仅支持 en（默认）。
        explode: true
        in: query
        name: lang
        required: false
        schema:
          default: en
          enum:
          - en
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_dictionary_lookup_200_response"
          description: 查询成功，返回该单词的完整词条数据。
        "400":
          description: 参数错误。例如 word 参数为空或超过了最大长度限制。
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_dictionary_lookup_404_response"
