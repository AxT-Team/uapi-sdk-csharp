          `contribution_count`。在前端只需使用两次循环（外层遍历 `weeks` 渲染列，内层遍历 `contribution_days`
          渲染方块），将 `color` 赋值给小方块的 `background-color`，就能完美复刻 GitHub 的贡献日历。
        question: 前端拿到 contribution_calendar 数据后，该怎么画那个贡献图？
      - answer: 这取决于您的 GitHub 隐私设置。GitHub 默认会隐藏私有仓库（Private Repositories）里的贡献活动。只有公开项目的
