  /web/tomarkdown/async:
    post:
      description: |-
        想把一个网页的内容转成干净的 Markdown 文本？这个异步接口可以帮你搞定，特别适合处理大型或复杂的网页。

        ## 功能概述

        提交一个网页 URL，我们会自动抓取主体内容，剔除广告、导航栏等干扰元素，并转换为 Markdown 格式。同时会提取标题、作者、发布日期等元数据，生成 YAML Front Matter。

        任务提交后会立即返回任务 ID，你可以用它来查询处理进度和结果。单个任务最长处理 60 秒，结果缓存 30 分钟。
      externalDocs:
        description: Interactive API reference
        url: https://uapis.cn/docs/api-reference/post-web-tomarkdown-async
      operationId: post-web-tomarkdown-async
      parameters:
      - description: 需要转换的网页URL。URL必须经过编码。
        example: https://example.com
        explode: true
        in: query
        name: url
        required: true
        schema:
          example: https://example.com
          type: string
        style: form
        x-tooltip: 支持HTTP/HTTPS协议，禁止访问内网地址
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/post_web_tomarkdown_async_202_response"
          description: 任务已提交成功，返回任务ID
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/post_web_tomarkdown_async_400_response"
          description: 请求参数错误
      summary: 网页转 Markdown
      tags:
      - WebParse
      x-search-words:
      - url转markdown
      - 网页转markdown
      - 异步
      - async
      - tomarkdown
      - 网页抓取
      - 内容提取
      - web scraping
      - 任务队列
      x-docs-url: https://uapis.cn/docs/api-reference/post-web-tomarkdown-async
  /web/tomarkdown/async/{task_id}:
    get:
      description: |-
        提交了网页转 Markdown 任务后，想知道处理进度和结果？用这个接口来查询。

        ## 功能概述
        通过任务 ID 查询转换任务的当前状态、处理进度和最终结果。任务结果缓存 30 分钟，期间可重复查询。

        ## 任务状态

        | 状态 | 说明 |
        |------|------|
        | `pending` | 等待处理 |
        | `processing` | 处理中 |
        | `completed` | 已完成，可获取结果 |
        | `failed` | 失败 |
        | `timeout` | 超时（超过 60 秒） |

        > [!NOTE]
        > 建议每 2-5 秒轮询一次，当状态为 `completed`、`failed` 或 `timeout` 时停止轮询。
      externalDocs:
        description: Interactive API reference
        url: https://uapis.cn/docs/api-reference/get-web-tomarkdown-async-status
      operationId: get-web-tomarkdown-async-status
      parameters:
      - description: 任务ID（由提交接口返回）
        example: a1b2c3d4-e5f6-47a8-b9c0-d1e2f3a4b5c6
        explode: false
        in: path
        name: task_id
        required: true
        schema:
          example: a1b2c3d4-e5f6-47a8-b9c0-d1e2f3a4b5c6
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_web_tomarkdown_async_status_200_response"
          description: 成功获取任务状态（包含各种状态的响应）
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_web_tomarkdown_async_status_404_response"
          description: 任务不存在或已过期
      summary: 转换任务状态
      tags:
      - WebParse
      x-search-words:
      - 查询任务
      - 任务状态
      - 异步结果
      - task status
      - 轮询
      - polling
      x-docs-url: https://uapis.cn/docs/api-reference/get-web-tomarkdown-async-status
