        explode: true
        in: query
        name: extended
        required: false
        schema:
          type: boolean
        style: form
        x-tooltip: 设为 true 获取更多气象数据
      - description: 返回多天预报数据（最多7天），含每天的最高温度、最低温度、白天夜间天气、风向风力、日出日落等。
        explode: true
        in: query
        name: forecast
        required: false
        schema:
          type: boolean
        style: form
        x-tooltip: 设为 true 获取最多 7 天预报，并返回每天的最高温度和最低温度
      - description: 返回逐小时预报（24小时），含温度、天气、风向风速、湿度、降水概率等。
        explode: true
        in: query
        name: hourly
        required: false
        schema:
          type: boolean
        style: form
        x-tooltip: 设为 true 获取逐小时预报
      - description: 返回分钟级降水预报（仅国内城市），精确到2分钟。
        explode: true
        in: query
        name: minutely
        required: false
        schema:
          type: boolean
        style: form
        x-tooltip: 仅国内城市可用，设为 true 获取精确到2分钟的分钟级降水
      - description: 返回18项生活指数（穿衣、紫外线、洗车、晾晒、空调、感冒、运动、舒适度、出行、钓鱼、过敏、防晒、心情、啤酒、雨伞、交通、空气净化器、花粉）。
        explode: true
