                type: string
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_image_bing_daily_400_response"
          description: 请求参数不正确。
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_image_bing_daily_404_response"
