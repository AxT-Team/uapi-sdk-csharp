  /network/ipinfo:
    get:
      description: |-
        想知道一个IP地址或域名来自哪里？这个接口可以帮你定位它。默认返回标准结果；如果传 `source=commercial`，可以返回更完整的位置信息。

        ## 功能概述
        提供一个公网IPv4、IPv6地址或域名，我们会查询并返回它的地理位置（国家、省份、城市）、经纬度、以及所属的运营商（ISP）和自治系统（ASN）信息。这在网络安全分析、访问来源统计等领域非常有用。

        当传 `source=commercial` 时，响应中会补充更完整的市、区、运营商、时区、海拔等信息，响应时间可能会稍长。
      externalDocs:
        description: Interactive API reference
        url: https://uapis.cn/docs/api-reference/get-network-ipinfo
      operationId: get-network-ipinfo
      parameters:
      - description: 你需要查询的公网IP地址或域名（支持IPv4和IPv6）。
        example: cn.bing.com
        explode: true
        in: query
        name: ip
        required: true
        schema:
          example: cn.bing.com
          type: string
        style: form
        x-tooltip: "例如: 8.8.8.8 或 cn.bing.com"
      - description: 查询结果类型。不传时返回标准结果；如果设置为 `commercial`，将返回更完整的地理位置信息，但响应时间可能会稍长。
        explode: true
        in: query
        name: source
        required: false
        schema:
          enum:
          - commercial
          type: string
        style: form
        x-tooltip: "例如: commercial"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_network_ipinfo_200_response"
          description: 查询成功！返回该IP地址的详细地理和网络信息。
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_network_ipinfo_400_response"
          description: IP地址参数无效。请检查 `ip` 参数是否提供，以及它是否是一个合法的公网IP地址。
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_network_ipinfo_404_response"
          description: 信息未找到。这通常意味着你查询的是一个内网IP地址（如 192.168.x.x）或一个未分配的公网IP地址，我们的数据库中没有它的信息。
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_network_ipinfo_500_response"
          description: 服务器内部错误。IP查询服务可能遇到了问题。
      summary: 查询 IP
      tags:
      - Network
      x-search-words:
      - ip
      - ip地址
      - 归属地
      - 地理位置
      - isp
