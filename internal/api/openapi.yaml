  /saying/random:
    get:
      description: |-
        一言接口，返回一条随机语录。通过 `mode` 参数切换四种返回方式，并支持按来源、分类、标签过滤。

        ## 四种模式（`mode`）
        - **`random`（默认）**：每次调用随机返回一条语录。
        - **`daily`**：同一天内返回固定的同一条，适合每日打卡、签到等场景。
        - **`recommend`**：配合 `scene` 参数，返回指定场景（如 `night`、`morning`）的语录。
        - **`moment`**：根据请求时所处时段，自动返回应景语录。

        ## 语言控制
        语料分中英文两类，可通过 `source` 或 `category` 控制：
        - 需要中文：`source` 选「综合句子语料库 / 曹星宇句子集」，或 `category` 选中文分类（如 影视、文学、诗词）。
        - 需要英文：`source` 选「Quotable / 英文历史名言」。

        ## 使用须知
        > [!NOTE]
        > - `source`、`category`、`tag` 支持多值，用英文逗号 `,` 或分号 `;` 分隔。
        > - `scene` 仅在 `mode=recommend` 时生效且必填，其他模式下会被忽略。
        > - 请求示例：
        >   - 随机：`GET /api/v1/saying/random`
        >   - 每日：`GET /api/v1/saying/random?mode=daily`
        >   - 场景：`GET /api/v1/saying/random?mode=recommend&scene=night`
        >   - 此刻：`GET /api/v1/saying/random?mode=moment`
      externalDocs:
        description: Interactive API reference
        url: https://uapis.cn/docs/api-reference/get-saying-random
      operationId: get-saying-random
      parameters:
      - description: 运行模式。不传或 random 为随机一言；可选 daily、recommend、moment。
        explode: true
        in: query
        name: mode
        required: false
        schema:
          default: random
          enum:
          - random
          - daily
          - recommend
          - moment
          type: string
        style: form
        x-tooltip: 可以通过切换模式，获取随机、每日固定或与时间关联的语录。
      - description: "推荐场景。当 mode=recommend 时必填，例如 night、morning、work 等。请从[支持的场景列表\
          ](#enum-list)中选择。"
        explode: true
        in: query
        name: scene
        required: false
        schema:
          enum:
          - dawn
          - morning
          - noon
          - afternoon
          - evening
          - night
          - deep-night
          - work
          - coding
          - meeting
          - relax
          - emo
          - philosophy
          type: string
        style: form
      - description: "语料来源过滤。支持重复传参，或使用逗号/分号分隔多个值。请从[支持的来源列表](#enum-list)中选择。"
        explode: true
        in: query
        name: source
        required: false
        schema:
          enum:
          - caoxingyu sentence
          - english historical quotes
          - quotable
          - sentences bundle
          type: string
        style: form
      - description: "分类过滤。支持重复传参，或使用逗号/分号分隔多个值。请从[支持的分类列表](#enum-list)中选择。"
        explode: true
        in: query
        name: category
        required: false
        schema:
          type: string
          x-uapi-enum-values:
          - 诗词
          - 古诗文
          - 文学
          - 哲学
          - 影视
          - 动画
          - 漫画
          - 游戏
          - 网络
          - 网易云
