          description: 查询成功！直接返回快递的完整物流轨迹。
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_misc_tracking_query_400_response"
          description: 参数错误，请检查快递单号是否正确。
        "404":
          content:
            application/json:
