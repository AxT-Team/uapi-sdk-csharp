  /image/ocr:
    post:
      description: |-
        无论您是需要实现票据的自动化录入，还是在网页前端对图片上的文字进行坐标框选，这个高精度的 OCR 接口都能为您提供强大的基础能力。

        ## 功能概述
        > [!IMPORTANT]
        > 如果您只关心图片上写了什么（例如截图取字或内容安全审核），强烈建议将 `need_location` 设置为 `false`。这会大幅精简返回的 JSON 数据体积，提升网络传输与系统解析效率。

        除了常规的图片转文字，这个接口还针对实际开发场景做了一些实用设计：
        - **前端文字高亮与结构化分析**：默认返回每一段文字的矩形坐标和四个顶点坐标。这非常适合使用 Canvas 在原图上画框高亮，或者在后端根据相对位置提取票据中的键值对信息。
        - **复杂拍摄环境下的抗畸变**：针对手机拍摄导致的旋转或倾斜，可以开启 `enable_cls=true`。服务端在识别前会自动进行方向预校正，显著提升识别准确率。
        - **灵活的输入与请求要求**：接口支持 `file`、`url` 或 `image_base64` 三种方式输入。请确保请求格式为 `multipart/form-data`，且图片链接在公网可直接访问。
      externalDocs:
        description: Interactive API reference
        url: https://uapis.cn/docs/api-reference/post-image-ocr
      operationId: post-image-ocr
      parameters: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/post_image_ocr_request"
        description: 包含待识别图像及可选配置的表单数据。无论使用哪种输入方式，请求体均需采用 `multipart/form-data` 格式。请在
          `file`、`url` 或 `image_base64` 中选择一种作为输入源。
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/post_image_ocr_200_response"
          description: 识别成功，返回统一的 OCR 结果对象。默认会带坐标信息；当 `need_location=false` 时，坐标相关字段会省略。
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/post_image_ocr_400_response"
          description: 请求参数不正确，比如没有传图片来源、提交了多重图片来源，或者布尔参数和 Base64 格式不合法。
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/post_image_ocr_413_response"
          description: 图片大小超过当前限制。
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/post_image_ocr_415_response"
          description: 上传内容不是可识别的常见图片格式。
        "502":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/post_image_ocr_502_response"
          description: 识别处理失败，请稍后重试。
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/post_image_ocr_503_response"
          description: 文字识别服务暂时不可用，请稍后再试。
      summary: 通用 OCR 文字识别
      tags:
      - Image
      x-search-words:
      - ocr
      - 图片ocr
      - 文字识别
      - 图片转文字
      - 提取文字
      - 截图取字
      - 拍照取字
      - 坐标
      - ocr转markdown
      - ocr markdown
      - 票据
      - 证件
      - base64 ocr
      - url ocr
      x-faq:
      - answer: 您可以遍历 `words_result` 数组，读取每一项里的 `location`。其中 `left` 和 `top` 是左上角坐标，`width`
          和 `height` 是矩形尺寸，直接传给 Canvas 的 `strokeRect` 就可以画出识别框。
        question: 如何在前端 Canvas 里根据坐标做文字框选？
      - answer: Base64 会让图片体积额外膨胀一部分。如果原图本身已经比较大，转成 Base64 后更容易触发请求体大小限制。对大图来说，更建议直接传
          `file`，或者先把图片放到公网地址再传 `url`。
        question: 为什么传 Base64 时更容易报体积过大？
      - answer: 这种场景建议把 `enable_cls` 设为 `true`。服务端会先尝试做文字方向校正，再进入识别流程，通常会比直接识别更稳定。
        question: 拍歪的票据或截图识别效果不稳定怎么办？
      x-seo-optimized-text: 免费高精度通用 OCR 文字识别 API 接口，可以通过本地文件、图片链接或 Base64 提交图片，准确提取完整文本、逐段文字和坐标信息。适合票据识别、证件扫描、截图取字、文档数字化和自动化表单录入等场景。
