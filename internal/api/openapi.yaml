        explode: true
        in: query
        name: width
        required: false
        schema:
          example: 800
          maximum: 8192.0
          minimum: 1.0
          type: integer
        style: form
      - description: 目标高度，单位是像素。可以单独传，也可以和 `width` 一起传。与 `max_width`、`max_height`
          互斥。
        example: 600
        explode: true
        in: query
        name: height
        required: false
        schema:
          example: 600
          maximum: 8192.0
          minimum: 1.0
          type: integer
        style: form
      - description: 最大宽度，单位是像素。只有在不传 `width`、`height` 时才生效，会按原比例缩放。
        explode: true
        in: query
        name: max_width
        required: false
        schema:
          maximum: 8192.0
          minimum: 1.0
          type: integer
        style: form
      - description: 最大高度，单位是像素。只有在不传 `width`、`height` 时才生效，会按原比例缩放。
        explode: true
        in: query
        name: max_height
        required: false
        schema:
          maximum: 8192.0
          minimum: 1.0
          type: integer
        style: form
      - description: 输出格式。可以传 `bmp`、`rgb565` 或 `rgb888`，不传时默认是 `bmp`。
        explode: true
        in: query
        name: format
        required: false
        schema:
          default: bmp
