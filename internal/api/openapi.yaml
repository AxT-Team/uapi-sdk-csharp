          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_github_user_200_response"
          description: 成功获取用户信息。如果开启了 `activity=true`，会在响应体中附加 `activity` 对象。
        "400":
          content:
            application/json:
              schema:
