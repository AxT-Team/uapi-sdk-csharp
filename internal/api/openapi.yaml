  /misc/district:
    get:
      description: |-
        一个接口，覆盖全球 243 个国家、中国省/市/区/街道四级行政区划，支持关键词搜索、行政编码查询、坐标反查三种查询模式（必须至少传入一种查询参数）。

        ## 功能概述
        根据用户输入的搜索条件快速查找行政区域信息。例如：中国 > 山东省 > 济南市 > 历下区 > 舜华路街道。

        无需注册、无需密钥，直接调用即可获取结构化的行政区域数据。支持三种查询方式：
        - 传 `adcode`，按行政编码精确查询，同时返回下级区划列表
        - 传 `lat` + `lng`，坐标反查附近地点
        - 传 `keywords`，按关键词搜索，支持中英文

        ## 中国与国际数据差异
        中国数据包含 `adcode`、`citycode` 等字段，支持省/市/区/街道四级逐级查询；国际城市数据不含这些字段，但额外提供 `population`（人口）和 `timezone`（时区）。

        > [!NOTE]
        > 部分城市（如东莞、文昌）没有区县层级，市级下方直接显示街道。街道级别的 `adcode` 返回的是所属区县的 `adcode`。
      externalDocs:
        description: Interactive API reference
        url: https://uapis.cn/docs/api-reference/get-misc-district
      operationId: get-misc-district
      parameters:
      - description: 关键词搜索（城市名、区县名，支持中英文）。
        example: 上海
        explode: true
        in: query
        name: keywords
        required: false
        schema:
          example: 上海
          type: string
        style: form
        x-tooltip: 支持中英文城市名搜索，如「上海」「London」。
      - description: 中国行政区划代码精确查询（如 `110000`），同时返回下级行政区。
        example: "110000"
        explode: true
        in: query
        name: adcode
        required: false
        schema:
          example: "110000"
          type: string
        style: form
        x-tooltip: 传入 adcode 时优先级最高，返回该区划及下级列表。
      - description: 纬度，与 `lng` 配合使用，坐标反查附近地点。
        example: 39.9
        explode: true
        in: query
        name: lat
        required: false
        schema:
          example: 39.9
          type: number
        style: form
        x-tooltip: 必须与 lng 同时传入。
      - description: 经度，与 `lat` 配合使用。
        example: 116.4
        explode: true
        in: query
        name: lng
        required: false
        schema:
          example: 116.4
          type: number
        style: form
        x-tooltip: 必须与 lat 同时传入。
      - description: 过滤行政级别。
        explode: true
        in: query
        name: level
        required: false
        schema:
          enum:
          - province
          - city
          - district
          - street
          type: string
        style: form
        x-tooltip: 可选值：province / city / district / street。
      - description: 过滤国家代码（ISO 3166-1 alpha-2），如 `CN`、`JP`、`US`、`GB`。
        example: CN
        explode: true
        in: query
        name: country
        required: false
        schema:
          example: CN
          type: string
        style: form
        x-tooltip: ISO 3166-1 alpha-2 国家代码。
      - description: 返回数量上限，默认 `20`，最大 `100`。
        example: 20
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 20
          example: 20
          maximum: 100.0
          type: integer
        style: form
        x-tooltip: 默认 20，最大 100。
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_misc_district_200_response"
          description: 查询成功！返回匹配的行政区域列表。
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_misc_district_400_response"
          description: 请求参数错误。
      summary: Adcode 国内外行政区域查询
