      - description: 词库范围：all/cet4/cet6/ielts/toefl/gre，默认 all。
        explode: true
        in: query
        name: category
        required: false
        schema:
          default: all
          enum:
          - all
          - cet4
          - cet6
          - ielts
          - toefl
          - gre
          type: string
        style: form
      - description: 返回数量，1-20，默认 1。
        example: 3
        explode: true
        in: query
        name: count
        required: false
        schema:
          default: 1
          example: 3
          type: integer
        style: form
      - description: 日期，格式 YYYY-MM-DD，作为每日单词的种子基准。
        explode: true
        in: query
        name: date
        required: false
        schema:
          type: string
        style: form
      - description: 固定种子，结果可复现；不可与 date 同时使用。
        explode: true
        in: query
        name: seed
        required: false
        schema:
          type: integer
        style: form
      - description: 是否返回例句，默认 true。
        explode: true
        in: query
        name: example
        required: false
        schema:
          default: true
          type: boolean
        style: form
      - description: 是否返回音标，默认 true。
        explode: true
        in: query
        name: phonetic
        required: false
        schema:
          default: true
          type: boolean
        style: form
      - description: 是否为每个单词附带详细释义（音标发音、中英释义、词形、词组、近义词、双语例句），默认 false。
        explode: true
        in: query
        name: define
        required: false
        schema:
          default: false
