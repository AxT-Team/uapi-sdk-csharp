  /api/get:
    get:
      description: |-
        **此接口用于“最高安全等级”方法。**

        您提供第一步中获得的ID，它会返回存储在服务器上的**加密数据**。您需要在自己的客户端中，使用您自己保管的密钥来解密它。
      externalDocs:
        description: Interactive API reference
        url: https://uapis.cn/docs/api-reference/get-clipzy-get
      operationId: get-clipzy-get
      parameters:
      - description: 片段的唯一 ID。
        example: PREF0Zv8Yj
        explode: true
        in: query
        name: id
        required: true
        schema:
          example: PREF0Zv8Yj
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_clipzy_get_200_response"
          description: 获取成功！返回加密并压缩后的数据。
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_clipzy_get_400_response"
          description: 请求参数错误，通常是缺少 `id` 参数。
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_clipzy_get_404_response"
          description: 片段未找到。它可能已过期、被删除或ID不正确。
      servers:
      - url: https://paste.sdjz.wiki
      summary: "步骤2 (方法一): 获取加密数据"
      tags:
      - Clipzy 在线剪贴板
      x-search-words:
      - clipzy
      - paste
      - 剪贴板
      - 加密
      - 获取文本
      - get
      - retrieve
      x-docs-url: https://uapis.cn/docs/api-reference/get-clipzy-get
  /api/raw/{id}:
    get:
      description: |-
        **此接口用于“方便自动化”方法。**

        您提供第一步获得的ID，并附上您自己保管的**解密密钥**作为 `key` 参数。服务器会直接为您解密，并返回纯文本内容。

        > [!IMPORTANT]
        > 查看文档首页的 **cURL 示例**，了解此接口最典型的用法。
      externalDocs:
        description: Interactive API reference
        url: https://uapis.cn/docs/api-reference/get-clipzy-raw
      operationId: get-clipzy-raw
      parameters:
      - description: 片段的唯一 ID。
        example: PREF0Zv8Yj
        explode: false
        in: path
        name: id
        required: true
        schema:
          example: PREF0Zv8Yj
          type: string
        style: simple
      - description: 用于解密的 Base64 编码的 AES 密钥。
        example: ES9tGP0v3e7oqzmAk3vMboxVOOBlvw9RS3DszeW675k=
        explode: true
        in: query
        name: key
        required: true
        schema:
          example: ES9tGP0v3e7oqzmAk3vMboxVOOBlvw9RS3DszeW675k=
          type: string
        style: form
        x-tooltip: 此密钥由客户端在创建加密片段前自行生成，不由服务器提供。请参考文档中的“客户端工作流程”部分。
      responses:
        "200":
          content:
            text/plain; charset=utf-8:
              schema:
                example: Ciallo～(∠・ω< )⌒★
                type: string
          description: 解密并获取成功！响应体为纯文本内容。
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_clipzy_raw_400_response"
          description: 请求参数错误，缺少 ID 或密钥。
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_clipzy_raw_403_response"
          description: 禁止访问。提供的密钥无法解密对应的数据。
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_clipzy_get_404_response"
          description: 片段未找到。它可能已过期、被删除或ID不正确。
      servers:
      - url: https://paste.sdjz.wiki
      summary: "步骤2 (方法二): 获取原始文本"
      tags:
      - Clipzy 在线剪贴板
      x-search-words:
      - clipzy
      - paste
      - 剪贴板
      - 解密
      - 原始文本
      - raw
      - plaintext
      x-docs-url: https://uapis.cn/docs/api-reference/get-clipzy-raw
  /api/store:
    post:
      description: |-
        这是所有流程的第一步。您的客户端应用需要先在本地准备好 **加密后的数据**，然后调用此接口进行上传。成功后，您会得到一个用于后续操作的唯一ID。

        > [!NOTE]
        > 您发送给此接口的应该是**密文**，而不是原始文本。请参考文档首页的JavaScript示例来了解如何在客户端进行加密。
      externalDocs:
        description: Interactive API reference
        url: https://uapis.cn/docs/api-reference/post-clipzy-store
      operationId: post-clipzy-store
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/post_clipzy_store_request"
        description: 包含加密数据和可选的TTL。
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/post_clipzy_store_200_response"
          description: 片段创建成功！返回该片段的唯一ID。
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/post_clipzy_store_400_response"
          description: 请求体缺失、格式错误或参数无效。
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/post_clipzy_store_413_response"
          description: 请求体过大。上传的数据（压缩后）超过了服务器限制。
      servers:
      - url: https://paste.sdjz.wiki
      summary: 步骤1：上传加密数据
      tags:
      - Clipzy 在线剪贴板
      x-search-words:
